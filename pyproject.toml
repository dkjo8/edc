[project]
name = "energy-descent-certificates"
version = "0.0.1"
description = "Distribution-free selective prediction and adaptive halting from the geometry of an energy-based reasoner's inference-time descent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
authors = [{ name = "Polished Snow", email = "david@plsn.ai" }]

# Core numeric stack is JAX (see docs/DECISIONS.md). CPU wheels by default so the
# offline smoke + CI need no GPU; the Modal image selects the CUDA build.
dependencies = [
    "jax>=0.4.34",
    "jaxlib>=0.4.34",
    "flax>=0.9.0",
    "optax>=0.2.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",      # logistic / GBT nonconformity mapper
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
plot = [
    "matplotlib>=3.9",
]
gpu = [
    # installed inside the Modal image only; keep out of the default lock
    "jax[cuda12]>=0.4.34",
]

[project.scripts]
edc = "edc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edc"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Tests must never require a GPU or a network download.
markers = [
    "slow: longer-running tests (still CPU-only)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "experiments", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E741"]  # ambiguous variable names (we use z, E, etc. deliberately)
