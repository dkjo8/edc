# EXPERIMENTAL (Phase 4g, WIP): IRED-style learned-landscape training on arithmetic.
# Opt-in via [train] objective="ired" — denoising score matching toward a learned per-class latent
# codebook (a genuinely multi-basin energy, vs the Phase-1 supervised bowl). Goal: test whether a
# learned landscape lets restart geometry beat softmax confidence (the Phase-4e caveat).
#
# STATUS: the scaffold trains (DSM + reachability + anchor decode) and is non-breaking, but does
# NOT yet reach a working reasoning regime under the shared fixed-step Langevin sampler — descent
# from z0 does not reliably land in the correct basin (ID acc ~ chance). Making it work needs
# annealed Langevin sampling at inference + a stronger score network. Do not use for real results
# yet; see docs/EXPERIMENTS.md (Phase 4g) and docs/SESSION_HANDOFF.md.
[run]
task = "arithmetic"
seed = 0
notes = "EXPERIMENTAL IRED landscape training (WIP)"

[task.arithmetic]
modular = false
n_operands = 6
ood_n_operands = 6
max_operand = 7
ood_max_operand = 9

[model]
latent_dim = 32
hidden_dim = 128
context_dim = 64

[inference]
k_restarts = 12
steps = 50
step_size = 0.1
init_scale = 1.0

[train]
objective = "ired"
epochs = 40
n_train = 8000
ired_noise_min = 0.1
ired_noise_max = 1.5
ired_ridge = 0.05
ired_decode_weight = 1.0

[eval]
n_eval = 1500

[conformal]
alpha = 0.1
delta = 0.05
n_calib = 1500
