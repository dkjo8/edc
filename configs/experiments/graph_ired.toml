# Phase 4i: STRONGER IRED learned-landscape reasoner on graph shortest-path. The Phase-4h IRED graph
# reasoner was capacity-limited (ID ~0.58) and only tied softmax; a larger model (hidden 256, latent
# 48, more training) reaches ID ~0.81 — matching/beating the basin-center reasoner. This tests the
# hypothesis that the weak graph flip was a weak-reasoner artifact: does the stronger IRED reasoner
# now let geometry beat softmax on graph?
[run]
task = "graph_planning"
seed = 0
notes = "stronger IRED learned-landscape reasoner on graph"

[task.graph_planning]
n_nodes = 7
ood_n_nodes = 10
edge_prob = 0.4
max_len = 4

[model]
latent_dim = 48
hidden_dim = 256
context_dim = 64

[inference]
k_restarts = 12
init_scale = 1.0
sampler = "annealed"
anneal_levels = 20
anneal_steps_per_level = 10
anneal_step_max = 0.5
anneal_step_min = 0.003
temperature = 0.01

[train]
objective = "ired"
epochs = 110
n_train = 12000
ired_ridge = 0.2
ired_stat_weight = 8.0
ired_decode_weight = 4.0

[eval]
n_eval = 700                # distinct (K, n_test) group from the Phase-4h weak run

[conformal]
alpha = 0.1
delta = 0.05
n_calib = 800
