name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Sync (CPU-only, no GPU wheels)
        run: uv sync --python 3.12 --extra dev
      - name: Lint
        run: uv run --extra dev ruff check src tests experiments analysis
      - name: Test (offline, CPU-only)
        env:
          JAX_PLATFORMS: cpu
        run: uv run --extra dev env PYTHONPATH=src pytest -q
